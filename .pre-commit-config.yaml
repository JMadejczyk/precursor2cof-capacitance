repos:
  # 1. Basic sanity checks (whitespace, YAML/JSON validation)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml

  # 2. Ruff: Replaces flake8 + isort (linting and sorting imports)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  # 3. Ruff Formatter: Replaces Black (formatting code)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format

  # 4. Pylint
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        require_serial: true
        args:
          - "-rn"
          - "--rcfile=.pylintrc"
