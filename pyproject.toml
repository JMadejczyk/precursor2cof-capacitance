[project]
name = "battery-rangers"
version = "0.1.0"
description = "A repository for molecule machine learning for batteries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.5.1",
    "cairosvg>=2.7.1",
    "chemprop>=2.2.1",
    "diffusers>=0.32.2",
    "docker>=7.1.0",
    "fastparquet>=2024.11.0",
    "fcd-torch>=1.0.7",
    "hoggorm>=0.13.3",
    "jupyter>=1.1.1",
    "lets-plot>=4.6.2",
    "lz4>=4.4.5",
    "marimo[lsp]>=0.13.1",
    "mlxtend>=0.23.4",
    "molscore>=1.9.3",
    "networkx>=3.4.2",
    "numpy>=2.2.2",
    "openpyxl>=3.1.5",
    "optuna>=4.5.0",
    "pre-commit>=4.1.0",
    "pylint>=3.3.3",
    "pymatgen>=2025.1.23",
    "pyscf>=2.8.0",
    "pytdc>=0.3.6",
    "pytest>=8.3.4",
    "python-lsp-server>=1.12.2",
    "pytorch-lightning>=2.5.0.post0",
    "scikit-fingerprints>=1.17.0",
    "scikit-learn>=1.6.1",
    "scikit-optimize>=0.10.2",
    "seaborn>=0.13.2",
    "selfies>=2.2.0",
    "shap>=0.49.1",
    "shapiq>=1.4.1",
    "tabpfn>=2.2.1",
    "tabpfn-extensions[post-hoc-ensembles]>=0.1.6",
    "tbparse>=0.0.9",
    "tensorboard>=2.19.0",
    "toml>=0.10.2",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.49.0",
    "upsetplot>=0.9.0",
    "vtk>=9.4.1",
    "wandb>=0.19.8",
    "xgboost>=2.1.3",
    "xlsxwriter>=3.2.9",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
