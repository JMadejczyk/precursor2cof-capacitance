name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t test-image -f test.Dockerfile .

      - name: Run Pylint Verification
        run: |
          docker run --rm test-image uv run pylint modules scripts --rcfile=.pylintrc

      - name: Run pre-commit
        run: |
          docker run --rm test-image uv run pre-commit run --all-files
