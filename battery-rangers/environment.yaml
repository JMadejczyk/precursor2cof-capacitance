name: battery
channels:
  - conda-forge
  - defaults
dependencies:
  - python = 3.12
  - numpy >= 1.26.4
  - pylint >= 3.3.1
  - rdkit >= 2024.09.2
  - pytest >= 8.3.4
  - hydra-core >= 1.3.2
  - pip >= 24.2
  - scikit-learn >= 1.5.2
  - pymatgen >= 2024.11.13
  - vtk >= 9.3.1
  - scikit-optimize >= 0.10.2
  - py-xgboost >= 2.1.2
  - networkx >= 3.4.2
  - pyscf >= 2.7.0
  - pip:
      - pre-commit >= 3.8.0
