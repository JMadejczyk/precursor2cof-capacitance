# for scripts/models_training.py: train and test on the CTFs only (data from scripts/filter_ctfs.py)
save_dir: 'results/best_ctf_only/'
datasets_dir: 'cof_matched_ctf/rth_0.99/'
dataset_params:
  num_folds: 10
  num_bins: 5
  num_bins_hyperparam_opt: 5
models: [
  'random_forest',
  'bayes',
]
metrics: [
  'pairwise_accuracy_score',
  'ndcg_score',
  'rmse',
  'mae',
  'mape',
  'smape',
  'r2_score'
]
hyperparam_opt: True
